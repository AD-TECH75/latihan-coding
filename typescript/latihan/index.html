<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<!-- bootstrap css -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
			crossorigin="anonymous"
		/>

		<!-- font awesome cdnjs -->
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.1.0/css/fontawesome.min.css"
		/>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.1.0/css/solid.min.css"
		/>
	</head>
	<style>
		body {
			background-color: #f8f9fa;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
		}

		.container {
			width: 500px;
			box-shadow: 10px 10px 30px rgba(0, 0, 0, 0.1);
			border-radius: 10px;
			margin: auto;
		}

		.container h1 {
			text-align: center;
            margin-top: 20px;
			margin-bottom: 20px;
		}

		.calculator {
			margin: 0 auto;
            padding: 20px;
		}

		.calculator .calculator-display {
			margin-bottom: 20px;
		}

		.calculator .calculator-display input {
			height: 100px;
			font-size: 2rem;
			text-align: right;
			padding: 10px;
		}

        .calculator .calculator-button .row button {
            width: 100px;
            height: 70px;
            font-size: 1.5rem;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.4);
            border-radius: 8px;
        }
		
        .calculator .calculator-button .row .operator {
            background-color: var(--bs-warning);
        }

        .calculator .calculator-button .row .delete {
            background-color: var(--bs-danger);
            color: white;
        }

        .calculator .calculator-button .row .zero {
            grid-column: span 2;
        }
	</style>
	<body>
		<main>
			<div class="container card">
				<h1 class="text-uppercase">Calculator typeScript</h1>
				<div class="calculator">
					<div class="calculator-display">
						<input
							type="text"
							id="display"
							class="form-control"
							value="0"
							disabled
						/>
					</div>

					<div class="calculator-button">
						<div class="row row-cols-4 g-1 gap-1">
							<button class="col operator" value="sqrt">&Sqrt;</button>
							<button class="col operator" value="percent">&percnt;</button>
							<button class="col operator" value="divide">&divide;</button>
							<button class="col delete" value="AC">AC</button>

							<button class="col" value="7">7</button>
							<button class="col" value="8">8</button>
							<button class="col" value="9">9</button>
							<button class="col operator" value="plus">&plus;</button>

							<button class="col" value="4">4</button>
							<button class="col" value="5">5</button>
							<button class="col" value="6">6</button>
							<button class="col operator" value="minus">&minus;</button>

							<button class="col" value="1">1</button>
							<button class="col" value="2">2</button>
							<button class="col" value="3">3</button>
							<button class="col operator" value="multiply">&times;</button>

							<button class="col-6 zero" value="0">0</button>
							<button value=".">.</button>
							<button class="col equal" value="equal">&equals;</button>
						</div>
					</div>
				</div>
			</div>
		</main>
	</body>
	<!-- bootstrap js -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"
	></script>

	<!-- font awesome cdnjs -->
	<script src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.1.0/js/all.min.js"></script>
</html>
