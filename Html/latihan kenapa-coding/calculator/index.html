<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<!-- bootstrap css -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
			crossorigin="anonymous"
		/>

		<!-- font awesome cdnjs -->
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.1.0/css/fontawesome.min.css"
		/>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.1.0/css/solid.min.css"
		/>
	</head>
	<style>
		body {
			background-color: #f8f9fa;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
		}

		.card {
			width: 400px;
			box-shadow: 10px rgba(12, 117, 214, 1);
			border-radius: 10px;
			margin: auto;
		}

		.calculator-display input {
			height: 100px;
			font-size: 4rem;
			text-align: right;
			padding: 10px;
		}

		.calculator-grid {
			display: grid;
			grid-template-columns: repeat(4, 1fr);
            gap: 10px;
		}

        .calculator-grid .btn {
            width: 100%;
            height: 70px;
            font-size: 1.5rem;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.4);
        }

        .calculator-grid .number {
            background-color: var(--bs-secondary);
            color: white;
        }

        .calculator-grid .zero {
            grid-column: span 2;
        }

		.calculator-grid .operator {
			background-color: var(--bs-warning);
		}

		.calculator-grid .delete {
			background-color: var(--bs-danger);
			color: white;
		}

		.calculator-grid #equals {
			background-color: var(--bs-primary);
			color: white;
		}

        .calculator-grid .coma {
            background-color: var(--bs-secondary);
            color: white;
        }
	</style>
	<body class="bg-secondary">
		<div class="container">
			<div class="card card-body shadow-lg">
				<div class="calculator-display mb-3">
					<input
						type="text"
						class="form-control display-calculator"
						id="display"
						value="0"
						readonly
					/>
				</div>

				<div class="calculator-button" id="calculator-button">
					<div class="calculator-grid">
						<button class="btn operator" value="sqrt">
							<i class="fa-solid fa-square-root-variable"></i>
						</button>
						<button class="btn operator" value="%">
							<i class="fa-solid fa-percent"></i>
						</button>
						<button class="btn operator" value="/">
							<i class="fa-solid fa-divide"></i>
						</button>
						<button class="btn delete">
							<i class="fa-solid fa-delete-left"></i>
						</button>

						<button class="btn number" value="7">7</button>
						<button class="btn number" value="8">8</button>
						<button class="btn number" value="9">9</button>
						<button class="btn operator" value="*">
							<i class="fa-solid fa-xmark"></i>
						</button>

						<button class="btn number" value="4">4</button>
						<button class="btn number" value="5">5</button>
						<button class="btn number" value="6">6</button>
						<button class="btn operator" value="+">
							<i class="fa-solid fa-plus"></i>
						</button>

						<button class="btn number" value="1">1</button>
						<button class="btn number" value="2">2</button>
						<button class="btn number" value="3">3</button>
						<button class="btn operator" value="-">
							<i class="fa-solid fa-minus"></i>
						</button>

						<!-- INI KUNCI -->
						<button class="btn number zero" value="0">0</button>
						<button class="btn decimal" value=".">,</button>
						<button class="btn equals" id="equals" value="=">
							<i class="fa-solid fa-equals"></i>
						</button>
					</div>
				</div>
			</div>
		</div>
	</body>

    <!-- script.js -->
    <script src="script.js"></script>

	<!-- bootstrap js -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"
	></script>

	<!-- font awesome cdnjs -->
	<script src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.1.0/js/all.min.js"></script>
</html>
