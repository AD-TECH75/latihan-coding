<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>counter and history</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main class="container">
			<h1>counter & history</h1>
			<div class="display">
				<h3>number : <span id="number"></span></h3>
			</div>

			<div class="button">
				<div class="type" id="type">
					<button class="plus" id="plus" value="plus">+</button>
					<button class="minus" id="minus" value="minus">-</button>
				</div>
				<button class="reset" id="reset">reset</button>
			</div>

			<hr />

			<div class="history">
				<h3>Riwayat :</h3>
				<ul id="history"></ul>
			</div>
		</main>
	</body>
	<script src="script.js"></script>
</html>
